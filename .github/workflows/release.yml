name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Leave blank to generate the next PocketBun release, or enter an existing PocketBun tag to republish it"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: pocketbun-release
  cancel-in-progress: false

jobs:
  github-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun for automatic release
        if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Generate release version and tag
        if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_REF_TYPE}" != "branch" ]]; then
            echo "::error::Select a branch when generating a release automatically."
            exit 1
          fi
          git fetch origin "${RELEASE_BRANCH}" --tags
          git merge --ff-only "origin/${RELEASE_BRANCH}"
          tag_name="$(bun run scripts/prepare_github_release.ts)"
          bun run docs:version
          bun run check:versions
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md docs/_data/pocketbun.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: release ${tag_name#v}"
          fi
          if ! git show-ref --verify --quiet "refs/tags/${tag_name}"; then
            git tag "${tag_name}"
            git push --atomic origin "HEAD:refs/heads/${RELEASE_BRANCH}" "refs/tags/${tag_name}"
          fi
          echo "TAG_NAME=${tag_name}" >> "$GITHUB_ENV"

      - name: Validate and check out release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_name="${TAG_NAME:-${INPUT_TAG:-$REF_TAG}}"
          if [[ ! "${tag_name}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-pocketbun\.[0-9]+$ ]]; then
            echo "::error::Use an existing PocketBun tag such as v0.40.4-pocketbun.0, not a PocketBase tag or branch: '${tag_name}'."
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/${tag_name}"; then
            echo "::error::Release tag '${tag_name}' does not exist in this fork. Create and push the intended version tag before running Release."
            exit 1
          fi
          git checkout --detach "refs/tags/${tag_name}"

      - name: Build release notes from changelog
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          tag_name="${TAG_NAME:-${INPUT_TAG:-$REF_TAG}}"
          if [[ -z "${tag_name}" ]]; then
            echo "Missing release tag name." >&2
            exit 1
          fi

          version="${tag_name#v}"
          section_file="/tmp/pocketbun-release-section.md"
          notes_file="/tmp/pocketbun-release-notes.md"
          section_count="$(awk -v prefix="## ${version} - " 'index($0, prefix) == 1 { count++ } END { print count + 0 }' CHANGELOG.md)"

          if [[ "${section_count}" -ne 1 ]]; then
            echo "Expected exactly one CHANGELOG.md section for ${version}, found ${section_count}." >&2
            exit 1
          fi

          awk -v version="${version}" '
            $0 ~ "^## " version " - " { found = 1; next }
            found && $0 ~ "^## " { exit }
            found { print }
          ' CHANGELOG.md > "${section_file}"

          if ! grep -q '[^[:space:]]' "${section_file}"; then
            echo "Empty CHANGELOG.md section for ${version}" >&2
            exit 1
          fi

          upstream_tag="$(tr -d '\r\n' < pocketbase_tag.txt)"
          {
            echo "Compatible with PocketBase ${upstream_tag}"
            echo
            cat "${section_file}"
          } > "${notes_file}"

          echo "TAG_NAME=${tag_name}" >> "$GITHUB_ENV"
          echo "NOTES_FILE=${notes_file}" >> "$GITHUB_ENV"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" --title "${TAG_NAME}" --notes-file "${NOTES_FILE}" --latest
          else
            gh release create "${TAG_NAME}" --title "${TAG_NAME}" --notes-file "${NOTES_FILE}" --latest
          fi
